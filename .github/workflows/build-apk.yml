name: Construir APK de Cubakan Remesas

on:
  workflow_dispatch:
  push:
    branches: [main, principal]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Instalar herramienta de descompresión
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Descomprimir proyecto
        run: |
          unzip -o CubakanRemesas_ProyectoAndroid.zip -d extracted_project/
          ls -la extracted_project/

      - name: Otorgar permisos a Gradlew y Compilar
        run: |
          cd extracted_project/*/ || cd extracted_project/
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Guardar APK generada
        uses: actions/upload-artifact@v4
        with:
          name: CubakanRemesas-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
