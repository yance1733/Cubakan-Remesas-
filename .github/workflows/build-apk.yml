
name: Construir APK de Cubakan Remesas

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: unzip -q CubakanRemesas_ProyectoAndroid.zip -d fuente

      - name: Construir APK
        working-directory: fuente/CubakanRemesas
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CubakanRemesas-debug-apk
          path: fuente/CubakanRemesas/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
