name: Build Cubakan Remesas APK

on:
  workflow_dispatch:
  push:
    branches: [main, principal]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip project
        run: |
          mkdir -p extracted_project
          ZIP_FILE=$(find . -maxdepth 2 -name "CubakanRemesas*.zip" | head -n 1)
          echo "ZIP file found: $ZIP_FILE"
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No ZIP file found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d extracted_project/
          ls -la extracted_project/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: |
          GRADLEW_PATH=$(find extracted_project -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubakanRemesas-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
